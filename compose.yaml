services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_APP_USER: meridian_app
      POSTGRES_APP_PASSWORD: meridian_app
      POSTGRES_OPS_CONTROL_USER: meridian_ops_control
      POSTGRES_OPS_CONTROL_PASSWORD: meridian_ops_control
      POSTGRES_READ_WORKER_USER: meridian_read_worker
      POSTGRES_READ_WORKER_PASSWORD: meridian_read_worker
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - meridian-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/010-app-role.sh:ro

volumes:
  meridian-postgres:
